[project]
name = "aulavault"
version = "0.1.0"
description = "Moodle Course Graph Extractor + File Resolver"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "pydantic>=2.0.0",
    "textual>=1.0.0",
    "rich>=13.0.0",
]

[project.scripts]
aulavault = "aulavault.__main__:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
